name: ai_chat
description: Hajeen AI - Intelligent AI Chat Platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  # Required for the SingleChildWidget type used by MultiBlocProvider.
  nested: ^1.0.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.2.0

  # Networking
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Routing
  go_router: ^16.2.1

  # Formatting
  intl: ^0.20.2

  # Utilities
  uuid: ^4.5.1

  # Files & Permissions
  file_picker: ^10.3.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/animations/
    - assets/lottie/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
