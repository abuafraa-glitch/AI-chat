name: ai_chat
description: Hajeen AI - Intelligent AI Chat Platform

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.5.1

  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Routing
  go_router: ^16.2.1

  # Localization
  easy_localization: ^3.0.8
  intl: ^0.20.2

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

  # UI
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  google_fonts: ^6.3.2

  # Utilities
  collection: ^1.19.1
  uuid: ^4.5.1

  # Files & Media
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.7.1
  injectable_generator: ^2.8.1
  json_serializable: ^6.11.0
  freezed: ^3.2.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/lottie/
    - assets/animations/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
